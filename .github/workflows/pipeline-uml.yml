
name: PlantUML

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build-uml:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar tplant
        run: npm install -g tplant

      - name: Instalar PlantUML e Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y plantuml graphviz

      - name: Gerar código PlantUML
        run: |
          mkdir -p docs
          tplant --associations \
            --input 'frontend/fileflip/src/app/models/**/*.ts' \
            --output '/docs/dominio.puml'

      - name: Gerar imagem PNG
        run: plantuml -tpng docs/dominio.puml

      - name: Disponibilizar diagramas para download
        uses: actions/upload-artifact@v4
        with:
          name: diagramas-uml
          path: |
            docs/dominio.png
            docs/dominio.puml
          retention-days: 30
          if-no-files-found: error
