name: PlantUML

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:
  build-uml:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar tplant
        run: npm install -g tplant

      - name: Gerar código PlantUML
        run: |
          mkdir -p docs
          tplant --input "frontend/fileflip/src/app/models/**/*.ts" --output "docs/dominio.puml"

      - name: Setup PlantUML
        uses: jassielof/setup-plantuml@v1

      - name: Gerar imagem PNG
        run: plantuml -tpng docs/dominio.puml

      - name: Commit diagramas
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: ":books: docs: diagrama de classe UML update"
          file_pattern: 'docs/*'