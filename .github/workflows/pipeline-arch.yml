name: Conformidade Arquitetural

on:
  push:
    branches: [ "**" ]
  pull_request:

jobs:
  check-layers:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend/arquivo_service

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '21' 
          distribution: 'oracle'
          cache: 'maven'

      - name: Dar permissão ao Maven Wrapper
        run: chmod +x mvnw

      - name: Executar Detector de Conformidade de Camadas
        run: ./mvnw test -Dtest=ArchitectureTest
